<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pueblos chorotegas y mangues, representación artística conceptual</title>
  <desc id="desc">Escena ilustrada de artesanos y familias chorotegas compartiendo cerámica, textiles y relatos alrededor del fuego.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263A5C"/>
      <stop offset=".5" stop-color="#6C4A5C"/>
      <stop offset="1" stop-color="#C0603C"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#F7D98B" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#E4B04A" stop-opacity=".4"/>
      <stop offset="1" stop-color="#E4B04A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#2F6F68"/>
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="none" stroke="#E4B04A" stroke-width="2" opacity=".7"/>
      <path d="M8 16 L16 8 L24 16 L16 24 Z" fill="#C0603C" opacity=".7"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="640" cy="160" r="66" fill="#F1E3C2" opacity=".88"/>
  <g fill="#F8F0E3" opacity=".5">
    <circle cx="140" cy="130" r="2.5"/><circle cx="300" cy="210" r="2"/><circle cx="500" cy="110" r="2"/>
    <circle cx="720" cy="280" r="2"/><circle cx="90" cy="330" r="2.5"/>
  </g>

  <g opacity=".7">
    <path d="M0 500 L150 340 L300 500 Z" fill="#3A2E45"/>
    <path d="M520 500 L680 330 L840 500 Z" fill="#3A2E45"/>
    <path d="M600 380 L680 330 L760 380 L720 395 L680 375 L640 398 Z" fill="#E4B04A" opacity=".22"/>
  </g>

  <path d="M0 560 Q200 520 400 545 T800 535 L800 1000 L0 1000 Z" fill="#211C2A"/>
  <circle cx="400" cy="700" r="280" fill="url(#fire)"/>

  <g>
    <path d="M400 750 L430 610 L460 750 Z" fill="#C0603C"/>
    <path d="M410 720 L430 640 L450 720 Z" fill="#E4B04A"/>
  </g>

  <g>
    <circle cx="250" cy="620" r="38" fill="#8C5238"/>
    <path d="M250 654 q-64 18 -76 118 l152 0 q-12 -100 -76 -118" fill="#2F6F68"/>
    <path d="M210 670 q40 -24 80 0" fill="none" stroke="#E4B04A" stroke-width="4"/>
    <path d="M226 600 q24 -26 48 0" fill="none" stroke="#F8F0E3" stroke-width="4"/>
    <path d="M186 760 q64 24 128 0" fill="none" stroke="#E4B04A" stroke-width="3" opacity=".7"/>
    <path d="M300 720 q40 20 44 64" fill="none" stroke="#8C5238" stroke-width="20" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="550" cy="610" r="40" fill="#A85E3F"/>
    <path d="M550 646 q-66 20 -78 126 l156 0 q-12 -106 -78 -126" fill="url(#weave)"/>
    <path d="M510 660 q40 -24 80 0" fill="none" stroke="#C0603C" stroke-width="5"/>
    <path d="M520 588 q30 -30 60 0" fill="none" stroke="#F8F0E3" stroke-width="4"/>
    <path d="M480 760 q70 24 140 0" fill="none" stroke="#E4B04A" stroke-width="3" opacity=".7"/>
    <path d="M512 730 q-40 18 -46 58" fill="none" stroke="#8C5238" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="390" cy="700" r="28" fill="#8C5238"/>
    <path d="M390 726 q-42 14 -50 82 l100 0 q-8 -68 -50 -82" fill="#C0603C"/>
    <path d="M360 742 q30 -16 60 0" fill="none" stroke="#E4B04A" stroke-width="3"/>
    <path d="M370 688 q20 -22 40 0" fill="none" stroke="#F8F0E3" stroke-width="3"/>
  </g>

  <g>
    <path d="M120 780 q-10 -60 20 -96 q8 40 26 54 q-20 12 -46 42" fill="#2F6F68" opacity=".8"/>
    <path d="M680 770 q14 -60 -14 -98 q-10 42 -28 56 q20 10 42 42" fill="#2F6F68" opacity=".8"/>
  </g>

  <g>
    <ellipse cx="170" cy="850" rx="66" ry="20" fill="#3A2522"/>
    <path d="M110 850 q0 -80 60 -80 q60 0 60 80 q-60 24 -120 0" fill="#8C5238"/>
    <path d="M126 800 q44 18 88 0" fill="none" stroke="#E4B04A" stroke-width="4"/>
    <path d="M138 826 q32 12 64 0" fill="none" stroke="#C0603C" stroke-width="3"/>

    <ellipse cx="640" cy="870" rx="58" ry="18" fill="#3A2522"/>
    <path d="M588 870 q0 -66 52 -66 q52 0 52 66 q-52 20 -104 0" fill="#7C5A58"/>
    <path d="M602 826 q38 16 76 0" fill="none" stroke="#E4B04A" stroke-width="4"/>
  </g>

  <g opacity=".85">
    <rect x="220" y="820" width="90" height="56" rx="8" fill="#2F6F68"/>
    <path d="M230 842 h70 M230 858 h70" stroke="#E4B04A" stroke-width="3"/>
    <rect x="500" y="830" width="80" height="46" rx="8" fill="#A84A2F"/>
    <path d="M510 846 h60 M510 858 h60" stroke="#F8F0E3" stroke-width="3" opacity=".7"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
