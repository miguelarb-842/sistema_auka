<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Santo Domingo de Guzmán, representación artística conceptual</title>
  <desc id="desc">Ilustración conceptual de Santo Domingo de Guzmán con hábito, libro y halo abstracto, entre arcos y flores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263A5C"/>
      <stop offset=".6" stop-color="#4A3340"/>
      <stop offset="1" stop-color="#A84A2F"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0E3"/>
      <stop offset="1" stop-color="#D9C4A8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7D98B" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#E4B04A" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E4B04A" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <g opacity=".35" fill="none" stroke="#F8F0E3" stroke-width="2">
    <path d="M60 420 V220 Q60 120 160 120 Q260 120 260 220 V420"/>
    <path d="M100 420 V240 Q100 160 160 160 Q220 160 220 240 V420"/>
    <path d="M540 420 V220 Q540 120 640 120 Q740 120 740 220 V420"/>
    <path d="M580 420 V240 Q580 160 640 160 Q700 160 700 240 V420"/>
  </g>

  <g opacity=".7" fill="#F8F0E3">
    <circle cx="140" cy="130" r="2.5"/><circle cx="700" cy="180" r="2"/><circle cx="80" cy="300" r="2"/>
    <circle cx="720" cy="330" r="2.5"/><circle cx="400" cy="90" r="2"/>
  </g>

  <circle cx="400" cy="430" r="240" fill="url(#halo)"/>
  <circle cx="400" cy="430" r="150" fill="none" stroke="#E4B04A" stroke-opacity=".55" stroke-width="3"/>
  <circle cx="400" cy="430" r="170" fill="none" stroke="#E4B04A" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 10"/>

  <g>
    <path d="M400 690 q-170 24 -220 310 l440 0 q-50 -286 -220 -310" fill="url(#robe)"/>
    <path d="M400 690 q-90 14 -124 130 q124 56 248 0 q-34 -116 -124 -130" fill="#1D2C47"/>
    <path d="M400 690 q-34 0 -34 80 l68 0 q0 -80 -34 -80" fill="#F8F0E3" opacity=".65"/>
    <path d="M400 700 v180" stroke="#E4B04A" stroke-width="4" opacity=".5"/>

    <path d="M290 760 q-40 50 -48 130" fill="none" stroke="#D9C4A8" stroke-width="34" stroke-linecap="round"/>
    <path d="M510 760 q40 50 48 130" fill="none" stroke="#D9C4A8" stroke-width="34" stroke-linecap="round"/>

    <circle cx="400" cy="500" r="86" fill="#C98B65"/>
    <path d="M314 500 q0 -100 86 -100 q86 0 86 100 q-20 -60 -86 -60 q-66 0 -86 60" fill="#F8F0E3"/>
    <path d="M326 520 q-26 20 -22 58 q24 14 38 -6" fill="#C98B65"/>
    <path d="M474 520 q26 20 22 58 q-24 14 -38 -6" fill="#C98B65"/>

    <circle cx="372" cy="500" r="5.5" fill="#1D1A24"/>
    <circle cx="428" cy="500" r="5.5" fill="#1D1A24"/>
    <path d="M400 506 q-8 24 0 30 q8 -6 0 -30" fill="#A86B4A"/>
    <path d="M384 548 q16 8 32 0" fill="none" stroke="#8C5238" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M352 530 q18 8 34 0 M414 530 q18 8 34 0" fill="none" stroke="#A86B4A" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

    <path d="M470 600 q20 -10 34 20 l-60 70 l-22 -16 z" fill="#F8F0E3"/>
    <path d="M470 600 q28 -2 34 20 l-34 20 q-4 -22 -0 -40" fill="#E4B04A"/>
    <path d="M462 624 l-26 62 l44 -20" fill="none" stroke="#1D2C47" stroke-width="4"/>

    <path d="M320 620 q40 24 40 80 l-70 0 q0 -56 30 -80" fill="#2F6F68"/>
    <path d="M330 650 q20 -16 40 0" fill="none" stroke="#E4B04A" stroke-width="3"/>
  </g>

  <g>
    <path d="M140 800 q-10 -70 20 -110 q8 46 28 62 q-22 12 -48 48" fill="#2F6F68"/>
    <path d="M660 810 q14 -70 -16 -112 q-8 48 -26 64 q20 12 42 48" fill="#2F6F68"/>
    <g fill="#E4B04A">
      <circle cx="170" cy="760" r="8"/>
      <circle cx="200" cy="735" r="6"/>
      <circle cx="630" cy="760" r="7"/>
      <circle cx="600" cy="735" r="5"/>
    </g>
    <g fill="#C0603C">
      <circle cx="140" cy="830" r="6"/>
      <circle cx="660" cy="840" r="6"/>
    </g>
  </g>

  <rect width="800" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
