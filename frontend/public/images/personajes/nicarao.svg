    <circle cx="426" cy="520" r="6" fill="#1D1A24"/>
    <path d="M400 524 q-10 28 0 36 q10 -8 0 -36" fill="#6C3A2E"/>
    <path d="M384 580 q16 10 32 0" fill="none" stroke="#1D1A24" stroke-width="4" stroke-linecap="round"/>
    <path d="M350 552 q22 10 42 0" fill="none" stroke="#6C3A2E" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M408 552 q22 10 42 0" fill="none" stroke="#6C3A2E" stroke-width="3" stroke-linecap="round" opacity=".7"/>

    <circle cx="326" cy="548" r="20" fill="#E4B04A"/>
    <circle cx="326" cy="548" r="9" fill="#C0603C"/>
    <circle cx="474" cy="548" r="20" fill="#E4B04A"/>
    <circle cx="474" cy="548" r="9" fill="#C0603C"/>
    <path d="M318 612 q82 30 164 0" fill="none" stroke="#E4B04A" stroke-width="4" opacity=".65"/>
  </g>

  <g opacity=".55">
    <path d="M110 760 q24 -90 -8 -150 q-14 66 -34 86 q26 12 42 64" fill="#2F6F68"/>
    <path d="M680 780 q28 -88 -6 -146 q-14 64 -34 84 q26 12 40 62" fill="#2F6F68"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
