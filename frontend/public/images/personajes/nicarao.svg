    <g>
      <path d="M356 404 q-24 -70 4 -130 q18 54 26 116" fill="#2F6F68"/>
      <path d="M390 396 q-14 -92 14 -150 q14 66 16 148" fill="#E4B04A"/>
      <path d="M426 400 q4 -86 34 -128 q2 62 -8 132" fill="#C0603C"/>
      <path d="M454 414 q24 -56 54 -76 q-6 50 -30 92" fill="#2F6F68"/>
      <path d="M330 420 q-30 -46 -36 -96 q30 36 50 94" fill="#C0603C"/>
      <path d="M338 420 q-52 -20 -82 -58 q48 10 88 54" fill="#E4B04A"/>
