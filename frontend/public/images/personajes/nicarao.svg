    <path d="M400 730 q-150 22 -190 270 l380 0 q-40 -248 -190 -270" fill="url(#mantle)"/>
    <path d="M400 720 q-90 14 -120 120 q120 46 240 0 q-30 -106 -120 -120" fill="url(#weave)"/>
    <path d="M400 740 q-60 10 -82 88 l164 0 q-22 -78 -82 -88" fill="#263A5C" opacity=".6"/>

    <path d="M300 760 q-50 40 -60 140" fill="none" stroke="#7C4636" stroke-width="34" stroke-linecap="round"/>
    <path d="M500 760 q50 40 60 140" fill="none" stroke="#7C4636" stroke-width="34" stroke-linecap="round"/>

    <path d="M400 430 q-72 0 -72 92 l0 92 q0 90 72 90 q72 0 72 -90 l0 -92 q0 -92 -72 -92" fill="url(#skin)"/>
    <path d="M336 500 q-22 10 -22 46 q0 30 24 34" fill="#8C5238"/>
    <path d="M464 500 q22 10 22 46 q0 30 -24 34" fill="#8C5238"/>

