<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Nicarao, representación artística conceptual</title>
  <desc id="desc">Retrato ilustrado de Nicarao con manto geométrico y tocado de plumas, frente a un lago y volcanes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18263D"/>
      <stop offset=".55" stop-color="#2F5560"/>
      <stop offset="1" stop-color="#7C5A58"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A85E3F"/>
      <stop offset="1" stop-color="#7C4636"/>
    </linearGradient>
    <linearGradient id="mantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6F68"/>
      <stop offset="1" stop-color="#1D2C47"/>
    </linearGradient>
    <pattern id="weave" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#263A5C"/>
      <path d="M0 18 L18 0 L36 18 L18 36 Z" fill="none" stroke="#E4B04A" stroke-width="2.5" opacity=".8"/>
      <path d="M9 18 L18 9 L27 18 L18 27 Z" fill="#C0603C" opacity=".8"/>
      <circle cx="18" cy="18" r="2.5" fill="#F8F0E3"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="640" cy="170" r="74" fill="#F1E3C2" opacity=".92"/>
  <circle cx="618" cy="158" r="70" fill="#2F5560" opacity=".55"/>
  <g fill="#F8F0E3" opacity=".6">
    <circle cx="120" cy="120" r="2.5"/><circle cx="220" cy="180" r="2"/><circle cx="330" cy="90" r="2.5"/>
    <circle cx="500" cy="150" r="2"/><circle cx="710" cy="280" r="2"/><circle cx="90" cy="280" r="2"/>
  </g>

  <g opacity=".8">
    <path d="M0 520 L160 330 L320 520 Z" fill="#1D2C47"/>
    <path d="M200 540 L390 300 L580 540 Z" fill="#22344F"/>
    <path d="M440 540 L620 350 L800 540 Z" fill="#1D2C47"/>
    <path d="M340 380 L390 300 L440 380 L415 395 L390 378 L365 398 Z" fill="#E4B04A" opacity=".22"/>
  </g>
  <rect y="540" width="800" height="120" fill="#2F5560"/>
  <g stroke="#E4B04A" stroke-opacity=".28" stroke-width="2">
    <path d="M40 590 q70 10 140 0"/>
    <path d="M250 620 q80 10 160 0"/>
    <path d="M540 600 q70 8 140 0"/>
  </g>
  <path d="M0 660 Q200 620 400 640 T800 630 L800 1000 L0 1000 Z" fill="#211C2A"/>

