      <path d="M252 704 q38 14 76 0" fill="none" stroke="#2F6F68" stroke-width="3"/>
    </g>

    <g>
      <circle cx="900" cy="646" r="27" fill="#8C5238"/>
      <path d="M900 673 q-46 14 -52 70 l104 0 q-6 -56 -52 -70" fill="#7C5A58"/>
      <path d="M860 704 q40 16 80 0" fill="none" stroke="#E4B04A" stroke-width="3"/>
    </g>
  </g>

  <g>
    <path d="M150 660 q-20 -60 8 -100 q10 44 28 56 q-20 10 -36 44" fill="#2F6F68" opacity=".8"/>
    <path d="M1030 650 q20 -60 -8 -100 q-10 44 -28 56 q20 10 36 44" fill="#2F6F68" opacity=".8"/>
  </g>

  <g>
