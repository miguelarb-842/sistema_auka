      <path d="M790 637 q-52 16 -60 80 l120 0 q-8 -64 -60 -80" fill="#C0603C"/>
      <path d="M744 668 q46 20 92 0" fill="none" stroke="#E4B04A" stroke-width="3"/>
      <path d="M760 592 q30 -26 60 0" fill="none" stroke="#F8F0E3" stroke-width="4"/>
    </g>

    <g>
