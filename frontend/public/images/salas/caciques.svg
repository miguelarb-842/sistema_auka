    <path d="M190 690 q22 -22 44 0" fill="none" stroke="#E4B04A" stroke-width="5"/>
    <path d="M190 712 h44" stroke="#E4B04A" stroke-width="3"/>
    <rect x="930" y="700" width="54" height="38" rx="12" fill="#7C5A58"/>
    <path d="M942 700 q15 -18 30 0" fill="none" stroke="#E4B04A" stroke-width="4"/>
  </g>

  <g transform="translate(430 650)">
    <rect width="140" height="96" rx="12" fill="#2C3F4A" stroke="#E4B04A" stroke-opacity=".4" stroke-width="2"/>
    <circle cx="38" cy="34" r="10" fill="none" stroke="#E4B04A" stroke-width="3"/>
    <path d="M64 24 l16 20 l-16 20 l-16 -20 z" fill="none" stroke="#C0603C" stroke-width="3"/>
    <path d="M92 22 q16 16 0 32 q-16 -16 0 -32" fill="none" stroke="#F8F0E3" stroke-width="2.5"/>
    <path d="M28 62 q30 16 60 0" fill="none" stroke="#2F6F68" stroke-width="3"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity=".55"/>
</svg>
