<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Los caciques de Nicaragua</title>
  <desc id="desc">Ilustración conceptual de un consejo de caciques junto a un lago y volcanes, reunidos alrededor del fuego.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18263D"/>
      <stop offset=".55" stop-color="#263A5C"/>
      <stop offset="1" stop-color="#7C5A58"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5560"/>
      <stop offset="1" stop-color="#182E3A"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7D98B" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#E4B04A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E4B04A" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="880" cy="150" r="58" fill="#F1E3C2" opacity=".9"/>
  <circle cx="860" cy="140" r="58" fill="#263A5C" opacity=".55"/>
  <g fill="#F8F0E3" opacity=".65">
    <circle cx="120" cy="100" r="2.5"/><circle cx="210" cy="160" r="2"/><circle cx="320" cy="80" r="3"/>
    <circle cx="430" cy="140" r="2"/><circle cx="540" cy="90" r="2.5"/><circle cx="700" cy="120" r="2"/>
    <circle cx="980" cy="90" r="2"/><circle cx="1080" cy="170" r="2.5"/><circle cx="190" cy="240" r="1.8"/>
  </g>

  <g>
    <path d="M0 430 L150 280 L290 430 Z" fill="#1D2C47"/>
    <path d="M200 450 L390 250 L580 450 Z" fill="#22344F"/>
    <path d="M1010 450 L1150 320 L1200 380 L1200 460 Z" fill="#1D2C47"/>
    <path d="M330 310 L390 250 L450 310 L420 330 L390 312 L360 332 Z" fill="#E4B04A" opacity=".28"/>
    <path d="M150 300 L150 430" stroke="#C0603C" stroke-width="3" opacity=".35"/>
  </g>

  <rect y="440" width="1200" height="180" fill="url(#lake)"/>
  <g stroke="#E4B04A" stroke-opacity=".28" stroke-width="2">
    <path d="M80 500 q80 10 160 0"/>
    <path d="M320 530 q90 12 180 0"/>
    <path d="M700 505 q95 12 190 0"/>
    <path d="M920 560 q70 8 140 0"/>
  </g>
  <g fill="#263A5C" opacity=".8">
    <path d="M0 600 Q200 560 400 585 T800 575 T1200 590 L1200 800 L0 800 Z"/>
  </g>

  <ellipse cx="600" cy="610" rx="300" ry="80" fill="#E4B04A" opacity=".13"/>

  <g>
    <path d="M560 640 L600 470 L640 640 Z" fill="#C0603C" opacity=".9"/>
    <path d="M575 610 L600 500 L625 610 Z" fill="#E4B04A"/>
    <path d="M585 560 q15 -20 30 0 q-15 18 -30 0" fill="#F8F0E3" opacity=".7"/>
  </g>
  <circle cx="600" cy="620" r="210" fill="url(#fire)"/>

  <g>
    <g>
      <path d="M600 520 q-50 -8 -54 -54 q34 4 54 54" fill="#F8F0E3" opacity=".85"/>
      <circle cx="600" cy="540" r="34" fill="#7C4636"/>
