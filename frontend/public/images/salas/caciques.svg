      <path d="M400 640 q-50 16 -58 76 l116 0 q-8 -60 -58 -76" fill="#2F6F68"/>
      <path d="M360 670 q40 18 80 0" fill="none" stroke="#E4B04A" stroke-width="3"/>
      <path d="M370 600 q30 -30 60 0" fill="none" stroke="#F8F0E3" stroke-width="4"/>
