<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Diriangén y la resistencia indígena</title>
  <desc id="desc">Ilustración conceptual de Diriangén, líder chorotega, de pie ante figuras españolas distantes al amanecer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E45"/>
      <stop offset=".42" stop-color="#8C4B45"/>
      <stop offset=".72" stop-color="#C0603C"/>
      <stop offset="1" stop-color="#E4B04A"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E3D"/>
      <stop offset="1" stop-color="#211C2A"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <pattern id="mantle" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#A84A2F"/>
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="#C0603C"/>
      <path d="M8 16 L16 8 L24 16 L16 24 Z" fill="#E4B04A" opacity=".85"/>
      <circle cx="16" cy="16" r="3" fill="#263A5C"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="300" cy="220" r="90" fill="#F3DFAF" opacity=".35"/>
  <g fill="#F3DFAF" opacity=".35">
    <path d="M0 300 L140 180 L280 300 Z"/>
    <path d="M900 300 L1040 170 L1200 300 Z"/>
  </g>

  <g opacity=".55">
    <path d="M0 470 L180 360 L330 470 L500 380 L680 470 L860 390 L1040 470 L1200 420 L1200 560 L0 560 Z" fill="#4A3340"/>
    <path d="M780 380 L900 260 L1020 380 Z" fill="#3A2E3D"/>
    <path d="M860 320 L900 260 L940 320 L920 330 L900 318 L880 332 Z" fill="#E4B04A" opacity=".25"/>
  </g>

  <path d="M0 540 Q260 500 520 530 T1040 520 T1200 540 L1200 800 L0 800 Z" fill="url(#hill)"/>
  <path d="M0 560 Q260 520 520 550 T1040 540 T1200 560" fill="none" stroke="#E4B04A" stroke-opacity=".22" stroke-width="2"/>

  <g opacity=".8">
    <path d="M940 520 l30 -190 l30 190 z" fill="#6C3240"/>
    <path d="M955 410 l15 -80 l15 80 z" fill="#C0603C"/>
    <path d="M960 380 h20 v40 h-20 z" fill="#E4B04A"/>
    <path d="M940 520 q30 -20 60 0" fill="none" stroke="#E4B04A" stroke-width="4"/>
  </g>

  <g opacity=".7">
    <g>
      <path d="M1030 560 q-10 -60 10 -96" fill="none" stroke="#1D1A24" stroke-width="18" stroke-linecap="round"/>
      <circle cx="1044" cy="450" r="18" fill="#1D1A24"/>
      <path d="M1044 432 q16 -16 32 0 q-16 10 -32 0" fill="#8B7A65"/>
      <path d="M1012 560 q32 -22 64 0" fill="#1D1A24"/>
      <path d="M1046 470 l40 70" stroke="#1D1A24" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g>
      <path d="M1120 570 q-8 -52 8 -84" fill="none" stroke="#1D1A24" stroke-width="16" stroke-linecap="round"/>
      <circle cx="1132" cy="472" r="16" fill="#1D1A24"/>
      <path d="M1132 456 q14 -14 28 0 q-14 8 -28 0" fill="#8B7A65"/>
      <path d="M1104 570 q28 -20 56 0" fill="#1D1A24"/>
    </g>
  </g>

  <g>
    <ellipse cx="500" cy="720" rx="230" ry="30" fill="#120F17" opacity=".5"/>
    <path d="M500 730 l-10 -210" stroke="#E4B04A" stroke-width="8" stroke-linecap="round"/>
    <path d="M500 540 q-90 -20 -110 -110 q80 14 110 110" fill="#E4B04A" opacity=".9"/>
    <circle cx="500" cy="480" r="48" fill="#8C5238"/>
    <path d="M500 432 q-26 -48 -6 -84 q10 30 30 42 q-18 16 -24 42" fill="#263A5C"/>
    <path d="M470 426 q30 -22 60 0" fill="none" stroke="#E4B04A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="484" cy="482" r="4.5" fill="#1D1A24"/>
    <circle cx="516" cy="482" r="4.5" fill="#1D1A24"/>
    <path d="M490 504 q10 8 20 0" fill="none" stroke="#1D1A24" stroke-width="3" stroke-linecap="round"/>
    <path d="M500 526 q-95 28 -115 150 l230 0 q-20 -122 -115 -150" fill="url(#mantle)"/>
    <path d="M500 526 q-50 14 -64 78 q64 26 128 0 q-14 -64 -64 -78" fill="#A84A2F" opacity=".35"/>
    <path d="M420 630 q-36 30 -42 80" fill="none" stroke="#8C5238" stroke-width="18" stroke-linecap="round"/>
    <path d="M580 630 q40 26 46 78" fill="none" stroke="#8C5238" stroke-width="18" stroke-linecap="round"/>
    <path d="M430 710 q-16 0 -16 18 l38 0 q0 -18 -22 -18" fill="#1D1A24"/>
    <path d="M570 710 q16 0 16 18 l-38 0 q0 -18 22 -18" fill="#1D1A24"/>
  </g>

  <g>
    <path d="M150 640 q-34 -110 20 -180 q14 78 44 100 q-38 18 -64 80" fill="#2F6F68" opacity=".8"/>
    <path d="M120 730 q-24 -82 16 -136 q10 60 34 78 q-28 14 -50 58" fill="#2F6F68" opacity=".65"/>
    <path d="M1020 660 q30 -90 -10 -150 q-12 64 -36 84 q30 14 46 66" fill="#2F6F68" opacity=".6"/>
  </g>

  <g fill="#F8F0E3" opacity=".55">
    <path d="M220 330 l10 -22 l10 22 z"/>
    <path d="M760 300 l8 -18 l8 18 z"/>
    <circle cx="700" cy="210" r="2.5"/>
    <circle cx="830" cy="250" r="2"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity=".55"/>
</svg>
