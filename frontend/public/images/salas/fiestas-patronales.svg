<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fiestas Patronales de Managua</title>
  <desc id="desc">Ilustración conceptual de una procesión popular al atardecer, con música, banderas y una iglesia al fondo.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263A5C"/>
      <stop offset=".48" stop-color="#6C4A5C"/>
      <stop offset=".72" stop-color="#C0603C"/>
      <stop offset="1" stop-color="#E4B04A"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C4636"/>
      <stop offset="1" stop-color="#3D2A2A"/>
