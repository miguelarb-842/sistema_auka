    <linearGradient id="church" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E45"/>
      <stop offset="1" stop-color="#221E30"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
