<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Xila, robot educativo</title>
  <desc id="desc">Ilustración conceptual de Xila, un robot amable con detalles geométricos inspirados en la cerámica nicaragüense.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F0E3"/>
      <stop offset="1" stop-color="#EFDFC7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EAD7BD"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D466B"/>
      <stop offset="1" stop-color="#1D2C47"/>
    </linearGradient>
    <pattern id="weave" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0 L24 12 L12 24 Z" fill="none" stroke="#E4B04A" stroke-width="2" opacity=".55"/>
      <circle cx="12" cy="12" r="2.2" fill="#C0603C"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="900" fill="url(#bg)"/>
  <circle cx="400" cy="450" r="330" fill="#F3E6D2"/>
  <circle cx="400" cy="450" r="330" fill="none" stroke="#263A5C" stroke-opacity=".22" stroke-width="2" stroke-dasharray="4 12"/>
  <circle cx="400" cy="450" r="292" fill="none" stroke="#C0603C" stroke-opacity=".25" stroke-width="1.5"/>

  <g opacity=".55">
    <path d="M120 250 l16 -30 l16 30 z" fill="#C0603C"/>
    <circle cx="665" cy="240" r="14" fill="#2F6F68"/>
    <path d="M650 640 l22 -38 l22 38 z" fill="#E4B04A"/>
    <circle cx="140" cy="620" r="9" fill="#263A5C"/>
    <path d="M95 430 q20 -20 40 0 q-20 20 -40 0" fill="none" stroke="#263A5C" stroke-width="3"/>
    <path d="M675 430 q20 -20 40 0 q-20 20 -40 0" fill="none" stroke="#C0603C" stroke-width="3"/>
  </g>

  <ellipse cx="400" cy="760" rx="190" ry="26" fill="#263A5C" opacity=".16"/>

  <g>
    <path d="M286 520 q-66 6 -82 62 q-8 30 18 38 q24 8 34 -20 l20 -52" fill="url(#body)" stroke="#263A5C" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="222" cy="604" r="22" fill="#C0603C" stroke="#263A5C" stroke-width="8"/>
    <path d="M514 520 q66 6 82 62 q8 30 -18 38 q-24 8 -34 -20 l-20 -52" fill="url(#body)" stroke="#263A5C" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="578" cy="604" r="22" fill="#C0603C" stroke="#263A5C" stroke-width="8"/>
  </g>

  <rect x="300" y="450" width="200" height="245" rx="64" fill="url(#body)" stroke="#263A5C" stroke-width="10"/>
  <rect x="330" y="492" width="140" height="142" rx="30" fill="url(#panel)" stroke="#18263D" stroke-width="6"/>
  <rect x="342" y="504" width="116" height="118" rx="22" fill="url(#weave)"/>
  <circle cx="400" cy="563" r="22" fill="#E4B04A" opacity=".95"/>
  <path d="M388 563 l8 8 l16 -18" fill="none" stroke="#263A5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="330" y="640" width="140" height="34" rx="17" fill="#2F6F68" opacity=".9"/>
  <circle cx="366" cy="657" r="5" fill="#F8F0E3"/>
  <circle cx="400" cy="657" r="5" fill="#E4B04A"/>
  <circle cx="434" cy="657" r="5" fill="#F8F0E3"/>

  <g>
    <path d="M340 690 l-6 62" stroke="#263A5C" stroke-width="16" stroke-linecap="round"/>
    <path d="M460 690 l6 62" stroke="#263A5C" stroke-width="16" stroke-linecap="round"/>
    <rect x="300" y="740" width="72" height="30" rx="15" fill="#C0603C" stroke="#263A5C" stroke-width="8"/>
    <rect x="428" y="740" width="72" height="30" rx="15" fill="#C0603C" stroke="#263A5C" stroke-width="8"/>
  </g>

  <rect x="292" y="200" width="216" height="196" rx="64" fill="url(#body)" stroke="#263A5C" stroke-width="10"/>
  <rect x="316" y="232" width="168" height="106" rx="42" fill="#1D2C47"/>
  <circle cx="364" cy="282" r="17" fill="#E4B04A"/>
  <circle cx="436" cy="282" r="17" fill="#E4B04A"/>
  <circle cx="364" cy="282" r="7" fill="#FFFDF8"/>
  <circle cx="436" cy="282" r="7" fill="#FFFDF8"/>
  <path d="M374 310 q26 20 52 0" fill="none" stroke="#F8F0E3" stroke-width="6" stroke-linecap="round"/>
  <circle cx="292" cy="290" r="24" fill="#2F6F68" stroke="#263A5C" stroke-width="8"/>
  <circle cx="508" cy="290" r="24" fill="#2F6F68" stroke="#263A5C" stroke-width="8"/>
  <path d="M400 200 v-34" stroke="#263A5C" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="150" r="17" fill="#E4B04A" stroke="#263A5C" stroke-width="8"/>
  <path d="M334 200 q66 -26 132 0" fill="none" stroke="#C0603C" stroke-width="8" stroke-linecap="round"/>

  <g opacity=".9">
    <path d="M214 200 q24 -30 48 0" fill="none" stroke="#2F6F68" stroke-width="5" stroke-linecap="round"/>
    <path d="M538 220 q24 -30 48 0" fill="none" stroke="#C0603C" stroke-width="5" stroke-linecap="round"/>
    <circle cx="590" cy="180" r="6" fill="#263A5C"/>
  </g>

  <rect width="800" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
