<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Xila Diriangén</title>
  <desc id="desc">Avatar del Robot Xila con motivos de montaña y bandera, en tonos rojo terracota.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E4D8"/>
      <stop offset="1" stop-color="#E8C4B4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E6CDBB"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="250" fill="#F0D9CC"/>
  <circle cx="300" cy="300" r="250" fill="none" stroke="#A84A2F" stroke-opacity=".45" stroke-width="4" stroke-dasharray="5 12"/>
  <circle cx="300" cy="300" r="212" fill="none" stroke="#263A5C" stroke-opacity=".18" stroke-width="2"/>

  <g opacity=".7">
    <path d="M60 250 L140 140 L220 250 Z" fill="#C0603C" opacity=".55"/>
    <path d="M380 250 L460 140 L540 250 Z" fill="#A84A2F" opacity=".45"/>
    <path d="M420 120 l30 -40 l30 40 z" fill="#E4B04A"/>
    <path d="M90 440 l24 -34 l24 34 z" fill="#2F6F68"/>
  </g>

  <g>
    <path d="M228 420 q-40 8 -44 54" fill="none" stroke="#263A5C" stroke-width="22" stroke-linecap="round"/>
    <path d="M372 420 q40 8 44 54" fill="none" stroke="#263A5C" stroke-width="22" stroke-linecap="round"/>
    <circle cx="186" cy="482" r="18" fill="#C0603C" stroke="#263A5C" stroke-width="7"/>
    <circle cx="414" cy="482" r="18" fill="#C0603C" stroke="#263A5C" stroke-width="7"/>

    <rect x="220" y="400" width="160" height="130" rx="48" fill="url(#body)" stroke="#263A5C" stroke-width="9"/>
    <rect x="250" y="430" width="100" height="70" rx="24" fill="#8C3F32"/>
    <path d="M270 480 l30 -30 l30 30" fill="none" stroke="#E4B04A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M270 480 h60" stroke="#F8F0E3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="450" r="5" fill="#E4B04A"/>

    <rect x="210" y="190" width="180" height="160" rx="56" fill="url(#body)" stroke="#263A5C" stroke-width="9"/>
    <rect x="234" y="220" width="132" height="86" rx="36" fill="#1D2C47"/>
    <circle cx="272" cy="262" r="13" fill="#E4B04A"/>
    <circle cx="328" cy="262" r="13" fill="#E4B04A"/>
    <circle cx="272" cy="262" r="5" fill="#FFFDF8"/>
    <circle cx="328" cy="262" r="5" fill="#FFFDF8"/>
    <path d="M282 284 q18 14 36 0" fill="none" stroke="#F8F0E3" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="210" cy="270" r="18" fill="#A84A2F" stroke="#263A5C" stroke-width="7"/>
    <circle cx="390" cy="270" r="18" fill="#A84A2F" stroke="#263A5C" stroke-width="7"/>
    <path d="M300 190 v-28" stroke="#263A5C" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="146" r="14" fill="#E4B04A" stroke="#263A5C" stroke-width="7"/>
    <path d="M248 188 q52 -22 104 0" fill="none" stroke="#C0603C" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g fill="#A84A2F" opacity=".75">
    <circle cx="120" cy="340" r="5"/><circle cx="480" cy="330" r="4"/><circle cx="470" cy="390" r="5"/>
  </g>

  <rect width="600" height="600" filter="url(#grain)" opacity=".5"/>
</svg>
